[project]
name = "youtube-mcp"
version = "1.1.0"
description = "The most comprehensive YouTube MCP server for Claude, Cursor & AI agents — 33 tools, multi-key quota rotation, zero-quota RSS fallback, channel audits, viral video research, SEO metadata, transcript extraction, and monetization strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "youtube", "mcp", "mcp-server", "model-context-protocol",
    "claude", "cursor", "ai-agent", "llm-tools",
    "youtube-api", "youtube-data-api", "youtube-analytics",
    "youtube-transcript", "youtube-subtitles", "youtube-captions",
    "youtube-seo", "youtube-research", "youtube-growth",
    "youtube-creator", "youtube-automation", "youtube-tools",
    "channel-analytics", "video-analytics", "competitor-analysis",
    "content-strategy", "viral-video", "thumbnail-generator",
    "audience-sentiment", "monetization", "sponsor-discovery",
    "shorts", "trending", "niche-research", "quota-rotation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Mohamed Benyahia", email = "benyahiamohamd@gmail.com" }
]

[project.urls]
Homepage = "https://github.com/mohamdben-yahia/youtube-mcp"
Documentation = "https://github.com/mohamdben-yahia/youtube-mcp#readme"
Repository = "https://github.com/mohamdben-yahia/youtube-mcp"
Issues = "https://github.com/mohamdben-yahia/youtube-mcp/issues"
Changelog = "https://github.com/mohamdben-yahia/youtube-mcp/releases"

dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.110.0",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
