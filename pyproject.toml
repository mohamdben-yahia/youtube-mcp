[project]
name = "youtube-mcp"
version = "0.1.0"
description = "High-performance Model Context Protocol (MCP) server for YouTube Data API v3 and transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YouTube MCP Contributors" }
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.110.0",
    "youtube-transcript-api>=0.6.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
youtube-mcp = "youtube_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
