services:
  youtube-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-mcp-server
    ports:
      - "8000:8000"
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - MCP_TRANSPORT=sse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
